<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VANTALAB — Digital Underground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #1f1f1f;
    }

    header h1 {
      font-size: 48px;
      background: linear-gradient(90deg, #00ffe7, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .content h2 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #ccc;
    }

    .content p {
      font-size: 18px;
      color: #888;
      max-width: 600px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      border: 2px solid #00ffe7;
      color: #00ffe7;
      text-decoration: none;
      border-radius: 50px;
      transition: 0.3s;
      font-size: 16px;
    }

    .btn:hover {
      background: #00ffe7;
      color: #000;
    }

    footer {
      padding: 15px;
      text-align: center;
      font-size: 12px;
      color: #444;
      border-top: 1px solid #1f1f1f;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 36px;
      }
      .content h2 {
        font-size: 24px;
      }
      .content p {
        font-size: 16px;
      }
      .btn {
        padding: 12px 25px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>VANTALAB</h1>
  </header>

  <div class="content">
    <h2>Welcome to the Digital Underground</h2>
    <p>Your private vault for drops, exploits, tools, and digital control — engineered for the chaos.</p>
    <a href="#" class="btn">Access the Lab</a>
  </div>

  <footer>
    © 2025 Vantalab.online — All Rights Reserved
  </footer>

</body>
</html>
