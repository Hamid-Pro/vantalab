<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VANTALAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 60px;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00ffe7, #0070f3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      color: #bbb;
      max-width: 600px;
      margin-bottom: 50px;
    }
    .btn {
      display: inline-block;
      padding: 15px 30px;
      font-size: 16px;
      border: 2px solid #00ffe7;
      color: #00ffe7;
      text-decoration: none;
      border-radius: 50px;
      transition: 0.3s;
    }
    .btn:hover {
      background: #00ffe7;
      color: #000;
    }
    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>
<body>

  <h1>VANTALAB</h1>
  <p>The underground digital lab where chaos meets control. Tools, drops, and digital secrets — coming soon.</p>
  <a href="#" class="btn">Enter the Lab</a>

  <div class="footer">© 2025 Vantalab.online</div>

</body>
</html>
