<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VANTALAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 70px;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #00ffe7, #0070f3, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00ffe7; }
      to   { text-shadow: 0 0 30px #00ffe7, 0 0 60px #ff00cc; }
    }

    .typewriter {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #00ffe7;
      animation: typing 4s steps(30, end) infinite alternate;
      font-size: 20px;
      color: #bbb;
      max-width: 600px;
      margin: 20px 0;
    }

    @keyframes typing {
      from { width: 0 }
      to   { width: 100% }
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      margin-top: 40px;
      font-size: 16px;
      border: 2px solid #00ffe7;
      color: #00ffe7;
      text-decoration: none;
      border-radius: 50px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00ffe7;
      color: #000;
    }

    .footer {
      position: absolute;
      bottom: 15px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>VANTALAB</h1>
    <div class="typewriter">Building digital chaos, one tool at a time...</div>
    <a href="#" class="btn">Access the Lab</a>
  </div>

  <div class="footer">© 2025 Vantalab.online — All Rights Reserved</div>

</body>
</html>
