<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VANTALAB — Digital Underground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    html, body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
      height: 100%;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      animation: pulseBG 6s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes pulseBG {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #1f1f1f;
    }

    header h1 {
      font-size: 54px;
      background: linear-gradient(90deg, #00ffe7, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      min-height: 80vh;
    }

    .glitch {
      font-size: 24px;
      color: #ccc;
      position: relative;
      margin-bottom: 30px;
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 #00ffe7, -2px 0 #ff00cc; }
      25% { text-shadow: -2px 0 #00ffe7, 2px 0 #ff00cc; }
      50% { text-shadow: 2px 0 #00ffe7, -2px 0 #ff00cc; }
      75% { text-shadow: -2px 0 #00ffe7, 2px 0 #ff00cc; }
      100% { text-shadow: 2px 0 #00ffe7, -2px 0 #ff00cc; }
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      border: 2px solid #00ffe7;
      color: #00ffe7;
      text-decoration: none;
      border-radius: 50px;
      transition: 0.3s;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: #00ffe7;
      color: #000;
    }

    footer {
      padding: 15px;
      text-align: center;
      font-size: 12px;
      color: #444;
      border-top: 1px solid #1f1f1f;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 36px; }
      .glitch { font-size: 18px; }
      .btn { padding: 12px 25px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <canvas id="fireworks"></canvas>

  <header>
    <h1>VANTALAB</h1>
  </header>

  <div class="content">
    <div class="glitch">Digital Chaos Engineered for Control</div>
    <a class="btn" onclick="launchFireworks()">Access the Lab</a>
  </div>

  <footer>
    © 2025 Vantalab.online — All Rights Reserved
  </footer>

  <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    let particles = [];

    function createFirework(x, y) {
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: x,
          y: y,
          radius: Math.random() * 2 + 1,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          angle: Math.random() * 2 * Math.PI,
          speed: Math.random() * 5 + 2,
          alpha: 1
        });
      }
    }

    function updateFireworks() {
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.alpha -= 0.015;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          i--;
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2, false);
          ctx.fillStyle = `rgba(${hexToRgb(p.color)}, ${p.alpha})`;
          ctx.fill();
        }
      }
      requestAnimationFrame(updateFireworks);
    }

    function launchFireworks() {
      const x = W / 2;
      const y = H / 2;
      createFirework(x, y);
    }

    function hexToRgb(h) {
      const res = h.match(/\d+/g);
      return res ? `${res[0]},${res[1]},${res[2]}` : '255,255,255';
    }

    window.addEventListener("resize", () => {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    });

    updateFireworks();
  </script>

</body>
</html>
